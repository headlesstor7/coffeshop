        }
      }

      const judulHalaman = adalahUbah ? "Ubah Akun" : "Tambah Akun";
      const nilaiAwalNama = akunDiedit ? akunDiedit.nama : "";
      const nilaiAwalUsername = akunDiedit ? akunDiedit.username : "";
      const nilaiAwalPassword = akunDiedit ? akunDiedit.password : "";
      const teksBantuanPassword = adalahUbah
        ? `<div class="help-text">Password kasir saat ini: <strong>${escapeHtml(nilaiAwalPassword)}</strong>. ${escapeHtml(TEKS.BANTUAN_PASSWORD_AKUN)}</div>`
        : `<div class="help-text">Contoh password kasir: <strong>kasir123</strong> (minimal 6 karakter)</div>`;

      areaKonten.innerHTML = `
        <div id="wadah-pesan-form-akun">${renderKotakPesanHalaman()}</div>

              <label class="form-label" for="input-username-akun">Username</label>
              <input class="input" type="text" id="input-username-akun" value="${escapeHtml(nilaiAwalUsername)}">
            </div>
            <div class="form-group">
              <label class="form-label" for="input-password-akun">Password</label>
              <input class="input" type="text" id="input-password-akun" value="${escapeHtml(nilaiAwalPassword)}" placeholder="Misal: kasir123">
              ${teksBantuanPassword}
            </div>
            <div class="form-actions">
              <button type="button" id="btn-batal-akun" class="btn btn-secondary">Batal</button>
              <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
          </form>
        </div>
      `;

      const wadahPesan = document.getElementById("wadah-pesan-form-akun");

      function tampilkanPesanFormAkun(teksError) {
        setelPesanHalaman("error", teksError, false);
        wadahPesan.innerHTML = renderKotakPesanHalaman();
      }

      document.getElementById("btn-batal-akun").addEventListener("click", function () {
        pindahHalaman("Kelola Akun Kasir");
      });

      document.getElementById("form-akun").addEventListener("submit", function (event) {
        event.preventDefault();
        const nama = document.getElementById("input-nama-akun").value.trim();
        const username = document.getElementById("input-username-akun").value.trim();
        const password = document.getElementById("input-password-akun").value;

        const adaSpasiUsername = /\s/.test(username);
        const usernameSudahDipakai = daftarAkun.some(function (a) {
          if (adalahUbah && akunDiedit && a.id === akunDiedit.id) {
            return false;
          }
          return a.username.toLowerCase() === username.toLowerCase();
        });

        const passwordValid = adalahUbah
          ? (password === "" || password.length >= 6)
          : password.length >= 6;

        if (!nama || !username || adaSpasiUsername || usernameSudahDipakai || !passwordValid) {
          tampilkanPesanFormAkun(TEKS.DATA_AKUN_TIDAK_LENGKAP);
          return;
        }

        if (statusAplikasi.demoGagalKoneksi) {
          tampilkanPesanFormAkun(TEKS.GAGAL_SIMPAN_DATA);
          return;
        }

        if (adalahUbah && akunDiedit) {
          akunDiedit.nama = nama;
          akunDiedit.username = username;
          if (password !== "") {
            akunDiedit.password = password;
          }
        } else {
          daftarAkun.push({
            id: idAkunBerikutnya++,
            nama: nama,
            username: username,
            password: password,
            peran: "Kasir",
            status: "Aktif"
          });
        }

        setelPesanHalaman("success", TEKS.AKUN_DISIMPAN, true);
        pindahHalaman("Kelola Akun Kasir");
      });

              <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
          </form>
        </div>
      `;

      const wadahPesan = document.getElementById("wadah-pesan-ubah-password");
      const inputLama = document.getElementById("input-password-lama");
      const inputBaru = document.getElementById("input-password-baru");
      const inputKonfirmasi = document.getElementById("input-konfirmasi-password");

      function kosongkanKolomPassword() {
        inputLama.value = "";
        inputBaru.value = "";
        inputKonfirmasi.value = "";
      }

      function tampilkanPesanPassword(tipe, teks) {
        setelPesanHalaman(tipe, teks, false);
        wadahPesan.innerHTML = renderKotakPesanHalaman();
        kosongkanKolomPassword();
      }

      document.getElementById("btn-batal-password").addEventListener("click", function () {
        const halamanPertama = statusAplikasi.pengguna.peran === "Admin" ? "Daftar Menu" : "Transaksi Baru";
        pindahHalaman(halamanPertama);
      });

      document.getElementById("form-ubah-password").addEventListener("submit", function (event) {
        event.preventDefault();
        const passwordLama = inputLama.value;
        const passwordBaru = inputBaru.value;
        const konfirmasi = inputKonfirmasi.value;

        if (!passwordLama || !passwordBaru || !konfirmasi) {
          tampilkanPesanPassword("error", TEKS.DATA_TIDAK_LENGKAP);
          return;
        }

        if (passwordLama !== statusAplikasi.pengguna.password) {
          tampilkanPesanPassword("error", TEKS.PASSWORD_LAMA_SALAH);
          return;
        }

        if (passwordBaru.length < 6) {
          tampilkanPesanPassword("error", TEKS.PASSWORD_BARU_MINIMAL);
          return;
        }

        if (konfirmasi !== passwordBaru) {
          tampilkanPesanPassword("error", TEKS.KONFIRMASI_PASSWORD_BEDA);
          return;
        }

        if (statusAplikasi.demoGagalKoneksi) {
          tampilkanPesanPassword("error", TEKS.GAGAL_SIMPAN_DATA);
          return;
        }

        statusAplikasi.pengguna.password = passwordBaru;
        tampilkanPesanPassword("success", TEKS.PASSWORD_BERHASIL);
      });
    }

    /* Penutup Dialog */
    function tutupDialog() {
      const wadahDialog = document.getElementById("wadah-dialog");
      wadahDialog.innerHTML = "";
      wadahDialog.classList.add("hidden");
    }

    /* Render Panel Demo */
    function renderPanelDemo() {
      const wadah = document.getElementById("wadah-panel-demo");
      if (!SHOW_DEMO_PANEL) {
        wadah.innerHTML = "";
        return;
      }

      wadah.innerHTML = `
        <div class="demo-panel">
          <div class="demo-panel-header">
            <div class="demo-panel-title">Panel Demo (bukan bagian sistem)</div>
            <button type="button" id="btn-tutup-demo" class="demo-panel-close" aria-label="Tutup">×</button>
          </div>
          <label class="demo-checkbox-label" for="demo-gagal-koneksi">
            <input type="checkbox" id="demo-gagal-koneksi">
            Simulasikan gagal koneksi
          </label>
          <label class="demo-checkbox-label" for="demo-kosongkan-menu">
            <input type="checkbox" id="demo-kosongkan-menu">
            Kosongkan data menu
          </label>
        </div>
      `;

      const btnTutupDemo = document.getElementById("btn-tutup-demo");
      const cbGagal = document.getElementById("demo-gagal-koneksi");
      const cbKosong = document.getElementById("demo-kosongkan-menu");

      btnTutupDemo.addEventListener("click", function () {
        wadah.innerHTML = "";
      });

      cbGagal.addEventListener("change", function () {
        statusAplikasi.demoGagalKoneksi = cbGagal.checked;
      });

      cbKosong.addEventListener("change", function () {
        statusAplikasi.demoKosongkanMenu = cbKosong.checked;
        if (statusAplikasi.pengguna && (statusAplikasi.halamanAktif === "Daftar Menu" || statusAplikasi.halamanAktif === "Transaksi Baru")) {
          renderAreaKonten();
        }
      });
    }

    /* Inisialisasi Aplikasi */
    document.getElementById("form-login").addEventListener("submit", prosesLogin);
    document.getElementById("tombol-logout").addEventListener("click", prosesLogout);
    renderPanelDemo();
    document.getElementById("input-login-username").focus();
  </script>
</body>
</html>
